<div class="container">
  <form (submit)="addtextbook()">
    <label for="courseID">Course ID</label>
    <input
      type="text"
      id="courseID"
      name="courseID"
      [(ngModel)]="textbookForm.courseID"
      required
    />
    <br />
    <label for="textBooktitle">Assign Book</label>
    <input
      type="text"
      id="textBooktitle"
      name="textBooktitle"
      [(ngModel)]="textbookForm.textBooktitle"
      required
    />
    <br />
    <label for="author">Author</label>
    <input
      type="text"
      id="author"
      name="author"
      [(ngModel)]="textbookForm.author"
      required
    />
    <br />
    <label for="edition">Edition</label>
    <input
      type="text"
      id="edition"
      name="edition"
      [(ngModel)]="textbookForm.edition"
      required
    />
    <br />
    <label for="ISBN">Isbn_No</label>
    <input
      type="text"
      id="ISBN"
      name="ISBN"
      [(ngModel)]="textbookForm.ISBN"
      required
    />
    <br />
    <label for="latest_version">Latest Version</label>
    <input
      type="text"
      id="latest_version"
      name="latest_version"
      [(ngModel)]="textbookForm.latest_version"
      required
    />
    <br />
    <label for="old_version">OLD Version</label>
    <input
      type="text"
      id="old_version"
      name="old_version"
      [(ngModel)]="textbookForm.old_version"
      required
    />
    <br />

    <label for="date_of_publish">Date of Publish:</label>
    <input
      type="date"
      id="date_of_publish"
      name="date_of_publish"
      [(ngModel)]="textbookForm.date_of_publish"
      required
    />
    <br />
    <label for="availabilityStatus">availabilityStatus:</label>
    <select
      id="availabilityStatus"
      name="availabilityStatus"
      [(ngModel)]="textbookForm.availabilityStatus"
      required
    >
      <option value="available">Available</option>
      <option value="non-available">Non-Available</option>
    </select>
    <br />
    <!-- New Textbook Type Field -->
    <label for="textbookType">Textbook Type:</label>
    <select
      id="textbookType"
      name="textbookType"
      [(ngModel)]="textbookForm.textbookType"
      required
    >
      <option value="ebook">Ebook</option>
      <option value="hardcopy">Hardcopy</option>
      <option value="both">Both</option>
    </select>
    <br />

    <!-- Conditionally Render No. of Hard Copies Field -->
    <div
      *ngIf="
        textbookForm.textbookType === 'hardcopy' ||
        textbookForm.textbookType === 'both'
      "
    >
      <label for="no_of_hardCopies">Number of Hard Copies</label>
      <input
        type="number"
        id="no_of_hardCopies"
        name="no_of_hardCopies"
        [(ngModel)]="textbookForm.no_of_hardCopies"
        required
      />
      <br />
    </div>

    <button type="submit">Submit</button>
  </form>
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
</div>
